<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Rayl</title>
  <meta name="description" content="Page not found." />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="color-scheme" content="dark" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@400;500&family=Inter:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .errpage {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 var(--pad);
      position: relative;
      overflow: hidden;
    }
    .errpage::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(40% 50% at 50% 40%, rgba(63, 184, 255, 0.08), transparent 70%);
      pointer-events: none;
    }
    .errpage__inner { position: relative; max-width: 560px; }
    .errpage__code {
      font-family: var(--font-display);
      font-weight: 300;
      font-size: clamp(96px, 18vw, 200px);
      letter-spacing: -0.06em;
      line-height: 1;
      color: var(--ink);
      margin-bottom: 24px;
    }
    .errpage__code em { font-family: var(--font-serif); color: var(--accent); }
    .errpage__title {
      font-family: var(--font-display);
      font-weight: 300;
      font-size: clamp(28px, 3.4vw, 40px);
      letter-spacing: -0.03em;
      color: var(--ink);
      margin-bottom: 16px;
    }
    .errpage__sub {
      color: var(--muted);
      font-size: 16px;
      margin-bottom: 40px;
      max-width: 44ch;
      margin-left: auto;
      margin-right: auto;
    }
  </style>
</head>
<body>
  <section class="errpage">
    <div class="errpage__inner">
      <div class="errpage__code">4<em>0</em>4</div>
      <h1 class="errpage__title">This page is not where you left it.</h1>
      <p class="errpage__sub">
        The link might be stale, or the page might never have existed. Either way,
        we'll get you back to somewhere useful.
      </p>
      <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
        <a href="/" class="btn btn--primary">Back to Rayl</a>
        <a href="/pay" class="btn btn--ghost">Visit Rayl Pay →</a>
      </div>
    </div>
  </section>
</body>
</html>
