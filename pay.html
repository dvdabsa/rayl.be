<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rayl Pay — Coming soon</title>
  <meta name="description" content="Rayl Pay is in development. We'll share more soon." />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="color-scheme" content="dark" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,700;0,800;1,700;1,800&family=Geist+Mono:wght@400;500&family=Inter:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .soon {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 var(--pad);
      position: relative;
      overflow: hidden;
    }
    .soon::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(40% 50% at 50% 40%, rgba(63, 184, 255, 0.06), transparent 70%);
      pointer-events: none;
    }
    .soon__inner { position: relative; max-width: 620px; }
    .soon__badge { margin-bottom: 32px; }
    .soon__title {
      font-family: var(--font-display);
      font-weight: 300;
      font-size: clamp(40px, 6vw, 80px);
      line-height: 1.02;
      letter-spacing: -0.04em;
      color: var(--ink);
      margin-bottom: 24px;
    }
    .soon__title em { font-family: var(--font-serif); color: var(--accent); font-weight: 400; }
    .soon__sub {
      color: var(--muted);
      font-size: clamp(15px, 1.2vw, 17px);
      line-height: 1.6;
      margin-bottom: 40px;
      max-width: 48ch;
      margin-left: auto;
      margin-right: auto;
    }
  </style>
</head>
<body>

  <header class="nav">
    <div class="nav__inner">
      <a href="/" class="nav__logo" aria-label="Rayl">
        <span class="logo__mark">Rayl</span>
      </a>
      <nav class="nav__links">
        <a href="/" class="nav__link">Home</a>
        <a href="mailto:hello@rayl.be" class="nav__link">Contact</a>
      </nav>
    </div>
  </header>

  <section class="soon">
    <div class="soon__inner">
      <span class="status-pill soon__badge">
        <span class="status-pill__dot"></span>
        In development
      </span>

      <h1 class="soon__title">
        Rayl Pay is <em>on its way.</em>
      </h1>

      <p class="soon__sub">
        We're still building. Once Rayl Pay is ready to share, you'll
        hear about it here first.
      </p>

      <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
        <a href="/" class="btn btn--primary">Back to Rayl</a>
        <a href="mailto:hello@rayl.be" class="btn btn--ghost">Get in touch</a>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container footer__inner">
      <a href="/" class="footer__logo"><span class="logo__mark">Rayl</span></a>
      <p class="footer__copy">
        © <span id="yr"></span> Rayl. All rights reserved.
        <span class="footer__sep">·</span>
        Rayl BV <span class="footer__sep">·</span>
        BE 0717.928.771 <span class="footer__sep">·</span>
        BTW BE 0717.928.771
      </p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
